<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>For ----- 🩷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-deep: #2b1620;
      --bg-deep-2: #3a1e2a;
      --chat-bg: #fff3ee;
      --bubble-bot: #ffffff;
      --bubble-bot-border: #f4d9dd;
      --bubble-user-1: #e8536f;
      --bubble-user-2: #f2836b;
      --accent-rose: #d94f70;
      --accent-gold: #e7a65c;
      --text-dark: #3a2430;
      --text-muted: #9c7580;
      --text-soft: #c98fa0;
      --shadow: 0 8px 30px rgba(60, 20, 30, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Nunito', sans-serif;
      background:
        radial-gradient(circle at 20% 10%, var(--bg-deep-2), var(--bg-deep) 60%);
      overflow: hidden;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--chat-bg);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
    }

    /* ---------- HEADER ---------- */
    #header {
      flex: 0 0 auto;
      background: linear-gradient(135deg, var(--accent-rose), #c23a5e);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
      z-index: 5;
    }

    #avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffd9e3, #f2836b 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }

    #header-info {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    #header-name {
      font-weight: 800;
      font-size: 15.5px;
      letter-spacing: 0.2px;
    }

    #header-status {
      font-size: 12px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7CFFB2;
      box-shadow: 0 0 6px #7CFFB2;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.8);
      }
    }

    #music-toggle {
      margin-left: auto;
      background: rgba(255, 255, 255, 0.18);
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    #music-toggle:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    #music-toggle:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    /* ---------- CHAT AREA ---------- */
    #chat {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 20px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
      position: relative;
    }

    #chat::-webkit-scrollbar {
      width: 5px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #e8c3ca;
      border-radius: 10px;
    }

    .row {
      display: flex;
      width: 100%;
    }

    .row.bot {
      justify-content: flex-start;
    }

    .row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.42;
      box-shadow: var(--shadow);
      animation: pop 0.28s cubic-bezier(.2, .9, .3, 1.3);
      word-wrap: break-word;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .bubble.bot {
      background: var(--bubble-bot);
      border: 1px solid var(--bubble-bot-border);
      color: var(--text-dark);
      border-bottom-left-radius: 6px;
    }

    .bubble.user {
      background: linear-gradient(135deg, var(--bubble-user-1), var(--bubble-user-2));
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .meta {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .row.user .meta {
      justify-content: flex-end;
      padding-right: 4px;
    }

    .row.bot .meta {
      padding-left: 4px;
    }

    .read-check {
      color: #5cc4e8;
    }

    /* typing indicator */
    .typing-row {
      display: flex;
      justify-content: flex-start;
    }

    .typing-bubble {
      background: var(--bubble-bot);
      border: 1px solid var(--bubble-bot-border);
      border-radius: 20px;
      border-bottom-left-radius: 6px;
      padding: 13px 17px;
      display: flex;
      gap: 4px;
      box-shadow: var(--shadow);
    }

    .typing-bubble span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-soft);
      animation: blink 1.2s infinite;
    }

    .typing-bubble span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-bubble span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {

      0%,
      80%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      40% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* quick reply buttons rendered as bubbles */
    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .choice-btn {
      border: 1.5px solid var(--accent-rose);
      background: #fff;
      color: var(--accent-rose);
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      padding: 9px 16px;
      border-radius: 18px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, color 0.15s;
      box-shadow: 0 3px 10px rgba(217, 79, 112, 0.15);
    }

    .choice-btn:hover {
      background: var(--accent-rose);
      color: #fff;
      transform: translateY(-2px);
    }

    .choice-btn:active {
      transform: translateY(0) scale(0.97);
    }

    .choice-btn.dodge {
      position: fixed;
      z-index: 50;
      transition: top 0.18s ease, left 0.18s ease;
    }

    /* ---------- INPUT BAR ---------- */
    #input-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #fff;
      border-top: 1px solid #f2dde1;
    }

    #text-input {
      flex: 1;
      border: 1.5px solid #f0d6db;
      border-radius: 22px;
      padding: 11px 16px;
      font-size: 15px;
      font-family: 'Nunito', sans-serif;
      outline: none;
      background: #fff8f6;
      color: var(--text-dark);
    }

    #text-input:focus {
      border-color: var(--accent-rose);
    }

    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--bubble-user-1), var(--bubble-user-2));
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(217, 79, 112, 0.35);
      transition: transform 0.15s;
    }

    #send-btn:active {
      transform: scale(0.92);
    }

    #input-bar.hidden {
      display: none;
    }

    /* ---------- FLOATING HEARTS ---------- */
    #hearts-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 3;
    }

    .heart {
      position: absolute;
      bottom: -30px;
      font-size: 18px;
      opacity: 0.85;
      animation: floatUp linear forwards;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0.9;
      }

      100% {
        transform: translateY(-115vh) translateX(var(--drift)) rotate(25deg);
        opacity: 0;
      }
    }

    /* cursor glow */
    #cursor-glow {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(233, 140, 163, 0.18), transparent 70%);
      transform: translate(-50%, -50%);
      z-index: 1;
      transition: opacity 0.3s;
      display: none;
    }

    @media(hover:hover) {
      #cursor-glow {
        display: block;
      }
    }

    /* ---------- FINAL DATE CARD ---------- */
    .ticket {
      max-width: 88%;
      margin: 6px auto 4px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(60, 20, 30, 0.28);
      overflow: hidden;
      position: relative;
      animation: pop 0.4s cubic-bezier(.2, .9, .3, 1.3);
      border: 1px solid #f4d9dd;
    }

    .ticket-top {
      background: linear-gradient(135deg, var(--accent-rose), #c23a5e);
      color: #fff;
      padding: 16px 18px 14px;
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 20px;
      text-align: center;
    }

    .ticket-divider {
      position: relative;
      height: 0;
      border-top: 2px dashed #f0c9d1;
      margin: 0 14px;
    }

    .ticket-divider::before,
    .ticket-divider::after {
      content: '';
      position: absolute;
      top: -11px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--chat-bg);
    }

    .ticket-divider::before {
      left: -25px;
    }

    .ticket-divider::after {
      right: -25px;
    }

    .ticket-body {
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ticket-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14.5px;
      color: var(--text-dark);
    }

    .ticket-row .ic {
      font-size: 17px;
    }

    .ticket-row b {
      color: var(--accent-rose);
    }

    /* confetti canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
    }

    /* intro overlay */
    #intro {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, var(--bg-deep), #4a2233);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }

    #intro h1 {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 26px;
      margin: 0 0 8px;
    }

    #intro p {
      font-size: 13px;
      opacity: 0.7;
      margin: 0;
    }

    #intro .pulse-heart {
      font-size: 38px;
      margin-bottom: 14px;
      animation: pulse 1.4s infinite;
    }
  </style>
</head>

<body>

  <div id="app">

    <div id="intro">
      <div class="pulse-heart">🩷</div>
      <h1>tap to open</h1>
      <p>a little something, just for you</p>
    </div>

    <div id="header">
      <div id="avatar">🩷</div>
      <div id="header-info">
        <div id="header-name">No one you know 👀</div>
        <div id="header-status"><span class="dot"></span> Online</div>
      </div>
      <button id="music-toggle" title="Toggle music">🔈</button>
    </div>

    <div id="hearts-layer"></div>
    <div id="chat"></div>

    <div id="input-bar" class="hidden">
      <input id="text-input" type="text" placeholder="Type here..." autocomplete="off">
      <button id="send-btn">➤</button>
    </div>

  </div>

  <div id="cursor-glow"></div>
  <canvas id="confetti-canvas"></canvas>

  <script>
    /* ============ CONFIG (placeholders — swap these for real details) ============ */
    const CONFIG = {
      correctName: "jiya",          // accepted answer to "guess who?"
      dateLabel: "Saturday, 7:30 PM",
      locationLabel: "Cafe Cheeno, Hazratganj, Lucknow",
      occasionNote: "wear something comfy, I'm taking you somewhere fun 🩷"
    };

    /* ============ DOM refs ============ */
    const chat = document.getElementById('chat');
    const inputBar = document.getElementById('input-bar');
    const textInput = document.getElementById('text-input');
    const sendBtn = document.getElementById('send-btn');
    const heartsLayer = document.getElementById('hearts-layer');
    const headerName = document.getElementById('header-name');
    const glow = document.getElementById('cursor-glow');
    const intro = document.getElementById('intro');
    const musicToggle = document.getElementById('music-toggle');

    let visitorName = "you";
    let wrongGuessCount = 0;

    /* ============ intro tap-to-start ============ */
    intro.addEventListener('click', () => {
      intro.style.transition = 'opacity 0.5s ease';
      intro.style.opacity = '0';
      setTimeout(() => intro.remove(), 500);
      startAmbientMotion();
      runScript();
    }, { once: true });

    /* ============ cursor glow ============ */
    window.addEventListener('mousemove', (e) => {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });

    /* ============ floating hearts ambient ============ */
    function spawnHeart() {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = ['🩷', '💕', '✨', '💗'][Math.floor(Math.random() * 4)];
      h.style.left = (Math.random() * 90 + 2) + '%';
      h.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
      h.style.animationDuration = (5 + Math.random() * 3) + 's';
      h.style.fontSize = (14 + Math.random() * 10) + 'px';
      heartsLayer.appendChild(h);
      setTimeout(() => h.remove(), 9000);
    }
    let ambientInterval;
    function startAmbientMotion() {
      ambientInterval = setInterval(spawnHeart, 1400);
    }
    function heartBurst(count = 40) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => spawnHeart(), i * 40);
      }
    }

    /* ============ simple ambient music (Web Audio, no external files) ============ */
    let audioCtx, musicNodes = [], musicOn = false;
    function toggleMusic() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (musicOn) {
        musicNodes.forEach(n => { try { n.osc.stop(); } catch (e) { } });
        musicNodes = [];
        musicOn = false;
        musicToggle.textContent = '🔈';
      } else {
        const notes = [261.6, 329.6, 392.0, 523.3]; // soft C major arpeggio-ish pad
        const master = audioCtx.createGain();
        master.gain.value = 0.05;
        master.connect(audioCtx.destination);
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const g = audioCtx.createGain();
          g.gain.value = 0;
          osc.connect(g); g.connect(master);
          osc.start();
          g.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 2 + i * 0.3);
          musicNodes.push({ osc, gain: g });
        });
        musicOn = true;
        musicToggle.textContent = '🔊';
      }
    }
    musicToggle.addEventListener('click', toggleMusic);

    /* ============ chat engine ============ */
    function scrollBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function addBubble(text, who = 'bot', withReceipt = false) {
      const row = document.createElement('div');
      row.className = 'row ' + who;
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + who;
      bubble.textContent = text;
      row.appendChild(bubble);
      chat.appendChild(row);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      meta.textContent = timeStr;
      if (withReceipt && who === 'user') {
        const chk = document.createElement('span');
        chk.className = 'read-check';
        chk.textContent = '✓✓';
        meta.appendChild(chk);
      }
      const metaRow = document.createElement('div');
      metaRow.className = 'row ' + who;
      metaRow.style.marginTop = '-6px';
      metaRow.appendChild(meta);
      chat.appendChild(metaRow);
      scrollBottom();
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'typing-row';
      row.id = 'typing-indicator';
      row.innerHTML = '<div class="typing-bubble"><span></span><span></span><span></span></div>';
      chat.appendChild(row);
      scrollBottom();
    }
    function hideTyping() {
      const t = document.getElementById('typing-indicator');
      if (t) t.remove();
    }

    function wait(ms) { return new Promise(res => setTimeout(res, ms)); }

    // bot "says" a line: typing indicator, then bubble
    async function botSay(text, opts = {}) {
      showTyping();
      const base = opts.minTyping ?? 900;
      const perChar = 22;
      const delay = Math.min(base + text.length * perChar, 3800);
      await wait(delay);
      hideTyping();
      addBubble(text, 'bot');
      await wait(250);
    }

    function userSay(text) {
      addBubble(text, 'user', true);
    }

    function showInputBar(placeholder = 'Type here...') {
      inputBar.classList.remove('hidden');
      textInput.placeholder = placeholder;
      textInput.value = '';
      textInput.focus();
    }
    function hideInputBar() {
      inputBar.classList.add('hidden');
    }

    function waitForTextInput() {
      return new Promise((resolve) => {
        function handler() {
          const val = textInput.value.trim();
          if (!val) return;
          cleanup();
          userSay(val);
          hideInputBar();
          resolve(val);
        }
        function keyHandler(e) { if (e.key === 'Enter') handler(); }
        function cleanup() {
          sendBtn.removeEventListener('click', handler);
          textInput.removeEventListener('keydown', keyHandler);
        }
        sendBtn.addEventListener('click', handler);
        textInput.addEventListener('keydown', keyHandler);
      });
    }

    // render choice buttons as a bubble-row, resolve with chosen label
    function waitForChoice(options) {
      return new Promise((resolve) => {
        const row = document.createElement('div');
        row.className = 'row user';
        const wrap = document.createElement('div');
        wrap.className = 'choices';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => {
            wrap.remove();
            userSay(opt);
            resolve(opt);
          });
          wrap.appendChild(btn);
        });
        row.appendChild(wrap);
        chat.appendChild(row);
        scrollBottom();
      });
    }

    // special: a dodging NO button among two static buttons
    function waitForProposalChoice() {
      return new Promise((resolve) => {
        const row = document.createElement('div');
        row.className = 'row user';
        const wrap = document.createElement('div');
        wrap.className = 'choices';

        const yes1 = document.createElement('button');
        yes1.className = 'choice-btn'; yes1.textContent = 'YES ❤️';
        const yes2 = document.createElement('button');
        yes2.className = 'choice-btn'; yes2.textContent = 'ABSOLUTELY YES 💕';
        const no = document.createElement('button');
        no.className = 'choice-btn'; no.textContent = 'NO 💔';

        const noLabels = ['NO 💔', '😂 Wrong Button', 'Not Allowed', 'System Error', 'Access Denied', 'Nice Try', 'Choose Happiness Instead'];
        let labelIdx = 0;

        function finish(choice) {
          wrap.remove();
          userSay(choice);
          window.removeEventListener('mousemove', dodgeHandler);
          resolve(choice);
        }
        yes1.addEventListener('click', () => finish('YES ❤️'));
        yes2.addEventListener('click', () => finish('ABSOLUTELY YES 💕'));
        no.addEventListener('click', (e) => {
          // if somehow clicked (e.g. touch), just relabel & dodge instead of accepting
          e.preventDefault();
        });

        function dodgeHandler(e) {
          const rect = no.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
          if (dist < 90) {
            no.classList.add('dodge');
            const maxX = window.innerWidth - rect.width - 20;
            const maxY = window.innerHeight - rect.height - 20;
            no.style.left = Math.max(10, Math.random() * maxX) + 'px';
            no.style.top = Math.max(80, Math.random() * maxY) + 'px';
            labelIdx = (labelIdx + 1) % noLabels.length;
            no.textContent = noLabels[labelIdx];
          }
        }
        window.addEventListener('mousemove', dodgeHandler);

        wrap.appendChild(yes1);
        wrap.appendChild(yes2);
        wrap.appendChild(no);
        row.appendChild(wrap);
        chat.appendChild(row);
        scrollBottom();
      });
    }

    /* ============ confetti ============ */
    function fireConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');
      const colors = ['#d94f70', '#e7a65c', '#ff8fa3', '#ffd166', '#f2836b', '#ffffff'];
      let particles = [];
      for (let i = 0; i < 160; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 120,
          y: canvas.height * 0.35,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 1.6) * 10,
          size: 5 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          vr: (Math.random() - 0.5) * 12,
          shape: Math.random() > 0.5 ? 'rect' : 'circle'
        });
      }
      let frame = 0;
      function tick() {
        frame++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.vy += 0.28;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color;
          if (p.shape === 'rect') {
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });
        particles = particles.filter(p => p.y < canvas.height + 50);
        if (frame < 220 && particles.length > 0) {
          requestAnimationFrame(tick);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      tick();
    }
